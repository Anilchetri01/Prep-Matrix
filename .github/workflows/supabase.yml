name: Supabase CI/CD (Migrations & Edge Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
    inputs:
      deploy_migrations:
        description: 'Apply database migrations (supabase db push)'
        required: true
        type: boolean
        default: true
      deploy_functions:
        description: 'Deploy Supabase Edge Functions'
        required: true
        type: boolean
        default: true

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_migrations == true)
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check and Apply Database Migrations
        run: |
          MIGRATION_COUNT=$(find Backend/supabase/migrations -maxdepth 1 -name "*.sql" 2>/dev/null | wc -l)
          if [ "$MIGRATION_COUNT" -gt 0 ]; then
            echo "Found $MIGRATION_COUNT migration(s). Checking credentials..."
            if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
              echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID secret."
              exit 1
            fi
            
            if [ -n "$SUPABASE_DB_PASSWORD" ]; then
              supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --workdir Backend
              supabase db push --include-all --password "$SUPABASE_DB_PASSWORD" --workdir Backend
            else
              supabase link --project-ref "$SUPABASE_PROJECT_ID" --workdir Backend
              supabase db push --include-all --workdir Backend
            fi
            echo "Migrations applied successfully."
          else
            echo "No .sql migration files found in Backend/supabase/migrations. Skipping database migrations."
          fi

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    needs: [deploy-migrations]
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true)) && (needs.deploy-migrations.result == 'success' || needs.deploy-migrations.result == 'skipped')
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify Required Secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN secret in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing SUPABASE_PROJECT_ID secret in GitHub Repository Secrets."
            exit 1
          fi

      - name: Sync Function Secrets
        run: |
          SECRETS_ARGS=()
          if [ -n "$GEMINI_API_KEY" ]; then
            SECRETS_ARGS+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          fi
          if [ -n "$GEMINI_MODEL" ]; then
            SECRETS_ARGS+=("GEMINI_MODEL=$GEMINI_MODEL")
          fi

          if [ ${#SECRETS_ARGS[@]} -gt 0 ]; then
            echo "Setting Supabase function secrets..."
            supabase secrets set "${SECRETS_ARGS[@]}" --project-ref "$SUPABASE_PROJECT_ID" --workdir Backend || true
          fi

      - name: Deploy Edge Functions
        run: |
          echo "Deploying Supabase Edge Functions from Backend/supabase/functions..."
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --workdir Backend
          echo "Edge Functions deployed successfully."
