name: CI Quality Gate

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'Documentation/**'
      - 'desktop.ini'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'Documentation/**'
      - 'desktop.ini'
  workflow_dispatch:

jobs:
  frontend-quality-gate:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Frontend/PrepMatrix/package-lock.json'

      - name: Install Dependencies
        working-directory: ./Frontend/PrepMatrix
        run: npm ci

      - name: Validate Question Bank Integrity
        working-directory: ./Frontend/PrepMatrix
        run: npm run validate:manual-questions

      - name: Run Gesture Physics Tests
        working-directory: ./Frontend/PrepMatrix
        run: npx --yes tsx scripts/testMobileDrawerGesture.mjs

      - name: Build Frontend Application
        working-directory: ./Frontend/PrepMatrix
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export VITE_SUPABASE_URL="${VITE_SUPABASE_URL:-https://placeholder.supabase.co}"
          export VITE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-placeholder-anon-key}"
          npm run build

  supabase-validation:
    name: Supabase Migrations & Edge Functions Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Setup Deno Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate SQL Migrations Syntax
        run: |
          MIGRATIONS_DIR="Backend/supabase/migrations"
          if [ -d "$MIGRATIONS_DIR" ]; then
            for file in "$MIGRATIONS_DIR"/*.sql; do
              if [ -f "$file" ]; then
                echo "Validating syntax of $file"
                if [ ! -s "$file" ]; then
                  echo "Error: Migration $file is empty"
                  exit 1
                fi
              fi
            done
            echo "Migration check completed."
          fi

      - name: Lint and Check Supabase Edge Functions
        working-directory: ./Backend/supabase/functions
        run: |
          if [ -f "deno.json" ]; then
            echo "Running Deno lint on Supabase Edge Functions..."
            deno lint
            echo "Checking Edge Function types..."
            deno check gemini-proxy/index.ts health-check/index.ts
          fi
